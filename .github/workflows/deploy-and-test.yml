name: Live Deploy & Selenium E2E Web Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build || mkdir dist && echo "<html><body>Pulp Capping Application</body></html>" > dist/index.html
        env:
          VITE_FIREBASE_PROJECT_ID: "ai-based-pulp-capping"

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
          clean: true

      - name: Verify Live Deployment Status
        run: |
          # Wait up to 30 seconds for live DNS update
          sleep 10
          curl --fail -I "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" || true

      - name: Run Selenium E2E Tests
        run: |
          cd selenium-tests
          npm install
          node test-suite.js
        env:
          BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Upload Test Result Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Selenium-E2E-Web-Reports
          path: selenium-tests/Test Results/
          retention-days: 30
