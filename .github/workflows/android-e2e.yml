name: Android Appium E2E Automation CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # Run weekly on Mondays at 2:00 AM

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: macos-13 # macOS is required to boot Android Emulators with hardware acceleration in GitHub Actions
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build Android App (Debug APK)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'automation/package.json'

      - name: Install Automation Dependencies
        run: |
          cd automation
          npm install

      - name: Install Appium & Drivers
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run E2E Test Suite (Simulated Mode fallback)
        run: |
          cd automation
          npm run test
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Publish Test Report to Action Run Summary
        run: |
          cat automation/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY

      - name: Setup GitHub Pages Workspace
        run: |
          mkdir -p public/reports/latest
          mkdir -p public/reports/history/build-${{ github.run_number }}
          
          # Copy latest reports
          cp -r automation/reports/HTML/* public/reports/latest/
          cp -r automation/reports/Summary/* public/reports/latest/
          cp -r automation/reports/Excel/* public/reports/latest/
          
          # Copy historical report archives
          cp -r automation/reports/HTML/* public/reports/history/build-${{ github.run_number }}/
          cp -r automation/reports/Summary/* public/reports/history/build-${{ github.run_number }}/
          cp -r automation/reports/Excel/* public/reports/history/build-${{ github.run_number }}/

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          clean: true

      - name: Upload Test Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Automation-Test-Reports-Build-${{ github.run_number }}
          path: automation/reports/
          retention-days: 30
